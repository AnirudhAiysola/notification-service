server:
  port: 8080

spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://localhost:5433/notify
    username: notify
    password: notify
  jpa:
    hibernate:
      ddl-auto: validate   # Hibernate only CHECKS tables; Flyway creates them
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092